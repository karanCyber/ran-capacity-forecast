name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  pipeline:
    # Proves the full pipeline runs end to end and still beats the baseline.
    # A model that quietly stops beating seasonal naive should fail CI, not sit
    # unnoticed in a README.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Train on a reduced dataset
        env:
          N_CELLS: "12"
          N_DAYS: "70"
          BACKTEST_DAYS: "7"
        run: python scripts/train.py
      - name: Verify artifacts, consistency and API
        env:
          N_CELLS: "12"
          N_DAYS: "70"
          BACKTEST_DAYS: "7"
        run: python scripts/verify.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ran-capacity-forecast:ci .
      - name: Confirm LightGBM imports in the slim runtime
        run: docker run --rm ran-capacity-forecast:ci python -c "import lightgbm, fastapi; print('ok')"
